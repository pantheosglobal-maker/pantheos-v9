<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07080d">

    <meta name="description"
        content="V9 Pantheos Store - Valorant VP Top Up. Fast and reliable Valorant recharge.">

    <title>Valorant VP Top Up | V9 Pantheos Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================================
           V9 VALORANT PRODUCT PAGE
        ===================================================== */

        .product-page {
            min-height: 100vh;
            padding-top: 120px;
            padding-bottom: 100px;
        }

        .product-hero {
            position: relative;
            overflow: hidden;
            padding: 45px;
            margin-bottom: 35px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background:
                linear-gradient(
                    120deg,
                    rgba(236,72,153,0.12),
                    rgba(16,19,28,0.96)
                );
        }

        .product-hero::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            right: -120px;
            top: -150px;
            border-radius: 50%;
            background: rgba(236,72,153,0.10);
            filter: blur(10px);
        }

        .breadcrumb {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .breadcrumb a {
            color: var(--text-soft);
        }

        .breadcrumb a:hover {
            color: #f472b6;
        }

        .product-hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .product-logo {
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        .product-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-title-area {
            flex: 1;
        }

        .product-title-area .eyebrow {
            margin-bottom: 7px;
        }

        .product-title-area h1 {
            margin-bottom: 12px;
            font-size: clamp(35px, 5vw, 58px);
            line-height: 1;
            letter-spacing: -0.045em;
        }

        .product-title-area h1 span {
            color: #f472b6;
        }

        .product-title-area p {
            max-width: 650px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .product-layout {
            display: grid;
            grid-template-columns:
                minmax(0, 1.5fr)
                minmax(300px, 0.75fr);
            gap: 25px;
            align-items: start;
        }

        .product-panel {
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card);
        }

        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .panel-heading h2 {
            font-size: 20px;
        }

        .panel-heading span {
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .package-section {
            margin-bottom: 30px;
        }

        .package-section:last-child {
            margin-bottom: 0;
        }

        .package-section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 14px;
        }

        .package-section-title .mini-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(236,72,153,0.12);
        }

        .package-section-title h3 {
            font-size: 14px;
        }

        .package-section-title p {
            color: var(--text-muted);
            font-size: 10px;
        }

        .empty-packages {
            padding: 25px 20px;
            border: 1px dashed rgba(255,255,255,0.13);
            border-radius: 14px;
            text-align: center;
            background: rgba(255,255,255,0.02);
        }

        .empty-packages .empty-icon {
            margin-bottom: 8px;
            font-size: 25px;
        }

        .empty-packages strong {
            display: block;
            margin-bottom: 5px;
            color: white;
            font-size: 13px;
        }

        .empty-packages p {
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.7;
        }

        .field-group {
            margin-bottom: 15px;
        }

        .field-group label {
            display: block;
            margin-bottom: 7px;
            color: #dce0e9;
            font-size: 11px;
            font-weight: 800;
        }

        .field-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #0b0e15;
            color: white;
            font-size: 13px;
            transition: border var(--transition);
        }
