<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLBB Top Up | Pantheos Global Store</title>

<link rel="stylesheet" href="css/style.css">

<style>
:root{
    --bg:#070b16;
    --bg2:#0d1426;
    --card:#111a2e;
    --card2:#17223a;
    --border:rgba(255,255,255,.08);
    --accent:#ffd54a;
    --accent2:#ffbf00;
    --text:#fff;
    --muted:#9ca8c2;
    --green:#25D366;
    --red:#ff6464;
    --blue:#5da9ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top right,rgba(70,100,190,.15),transparent 32%),
        radial-gradient(circle at bottom left,rgba(255,213,74,.05),transparent 28%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.container{
    width:min(1180px,calc(100% - 24px));
    margin:auto;
    padding:16px 0 60px;
}


/* =========================
   BACK
========================= */

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#fff;
    text-decoration:none;
    padding:10px 14px;
    margin-bottom:16px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.04);
    transition:.2s;
}

.back-btn:hover{
    background:rgba(255,255,255,.08);
    transform:translateX(-2px);
}


/* =========================
   HERO
========================= */

.hero{
    position:relative;
    min-height:340px;
    overflow:hidden;
    border-radius:24px;
    border:1px solid var(--border);
    box-shadow:0 20px 55px rgba(0,0,0,.3);
    margin-bottom:25px;
}

.hero-banner{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:
        linear-gradient(
            90deg,
            rgba(3,7,17,.94) 0%,
            rgba(3,7,17,.72) 46%,
            rgba(3,7,17,.25) 100%
        );
}

.hero-content{
    position:relative;
    z-index:2;
    min-height:340px;
    display:flex;
    align-items:center;
    padding:40px;
}

.hero-inner{
    max-width:680px;
}

.hero-logo{
    width:76px;
    height:76px;
    object-fit:cover;
    border-radius:17px;
    border:2px solid rgba(255,255,255,.15);
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    margin-bottom:16px;
}

.hero-badge{
    display:inline-flex;
    padding:7px 11px;
    margin-bottom:11px;
    border-radius:999px;
    background:rgba(255,213,74,.1);
    border:1px solid rgba(255,213,74,.2);
    color:var(--accent);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.5px;
}

.hero h1{
    font-size:clamp(2rem,5vw,3.1rem);
    line-height:1.08;
    margin-bottom:12px;
}

.hero-description{
    max-width:600px;
    color:#d1d7e5;
    line-height:1.65;
    font-size:.95rem;
}


/* =========================
   SECTIONS
========================= */

.section{
    margin-top:26px;
}

.section-heading{
    margin-bottom:14px;
}

.section-title{
    font-size:1.35rem;
    font-weight:800;
}

.section-subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:.84rem;
}


/* =========================
   PLAYER ACCOUNT
========================= */

.account-box{
    padding:21px;
    border-radius:19px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,var(--card),var(--bg2));
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.account-grid{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
    align-items:end;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    color:#e7ebf4;
    font-size:.86rem;
    font-weight:700;
}

.input-group input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid var(--border);
    outline:none;
    border-radius:11px;
    background:var(--bg2);
    color:#fff;
}

.input-group input::placeholder{
    color:#66728b;
}

.input-group input:focus{
    border-color:rgba(255,213,74,.6);
    box-shadow:0 0 0 3px rgba(255,213,74,.08);
}

.validate-btn{
    height:48px;
    padding:0 22px;
    border:0;
    border-radius:11px;
    background:var(--accent);
    color:#111;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
}

.validate-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

.validate-btn:active{
    transform:translateY(0);
}

.validation-status{
    display:none;
    margin-top:13px;
    padding:11px 13px;
    border-radius:11px;
    font-size:.84rem;
    line-height:1.4;
}

.validation-status.show{
    display:block;
}

.validation-status.success{
    color:#65ed99;
    background:rgba(37,211,102,.08);
    border:1px solid rgba(37,211,102,.16);
}

.validation-status.error{
    color:#ff8585;
    background:rgba(255,100,100,.08);
    border:1px solid rgba(255,100,100,.15);
}

.account-note{
    margin-top:10px;
    color:var(--muted);
    font-size:.76rem;
    line-height:1.5;
}


/* =========================
   ORDER AREA
========================= */

#orderArea{
    display:none;
}

#orderArea.show{
    display:block;
    animation:fadeUp .35s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   SPECIAL PASSES
========================= */

.special-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.special-card{
    width:100%;
    min-width:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:15px;
    background:linear-gradient(145deg,var(--card),var(--card2));
    color:#fff;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.special-card:hover{
    transform:translateY(-2px);
    border-color:rgba(255,213,74,.5);
}

.special-card.active{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(255,213,74,.16);
}

.special-card img{
    width:64px;
    height:64px;
    flex:0 0 64px;
    object-fit:cover;
    border-radius:11px;
}

.special-info{
    min-width:0;
}

.special-name{
    display:block;
    font-size:.9rem;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.special-price{
    display:block;
    margin-top:5px;
    color:var(--accent);
    font-size:.9rem;
    font-weight:900;
}


/* =========================
   DIAMONDS
========================= */

.diamond-grid{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:9px;
}

.diamond-card{
    min-height:91px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:8px 5px;
    border:1px solid var(--border);
    border-radius:13px;
    background:linear-gradient(145deg,var(--card),var(--card2));
    color:#fff;
    cursor:pointer;
    transition:.2s;
}

.diamond-card:hover{
    transform:translateY(-2px);
    border-color:rgba(255,213,74,.5);
}

.diamond-card.active{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(255,213,74,.18);
}

.diamond-icon{
    font-size:1rem;
}

.diamond-amount{
    font-size:.94rem;
    font-weight:800;
}

.diamond-price{
    color:var(--accent);
    font-size:.84rem;
    font-weight:900;
}


/* =========================
   SUMMARY
========================= */

.summary-box{
    margin-top:26px;
    padding:21px;
    border-radius:19px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,var(--card),var(--card2));
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.summary-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:17px;
}

.summary-title{
    font-size:1.25rem;
    font-weight:800;
}

.summary-subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:.82rem;
}

.summary-status{
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    color:var(--muted);
    font-size:.7rem;
    font-weight:800;
    white-space:nowrap;
}

.summary-status.selected{
    color:#65ed99;
    background:rgba(37,211,102,.1);
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:10px 0;
    border-top:1px solid rgba(255,255,255,.055);
}

.summary-label{
    color:var(--muted);
    font-size:.85rem;
}

.summary-value{
    text-align:right;
    font-size:.86rem;
}

.summary-value.highlight{
    color:var(--accent);
}

.total-row{
    margin-top:3px;
    padding-top:14px;
    border-top:1px dashed rgba(255,255,255,.1);
}

.summary-total{
    color:var(--accent);
    font-size:1.2rem;
}

.summary-message{
    margin-top:12px;
    color:var(--muted);
    font-size:.82rem;
}

.summary-message.error{
    color:#ff8585;
}

.continue-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:var(--accent);
    color:#111;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.continue-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
}


/* =========================
   PAYMENT
========================= */

#paymentSection{
    display:none;
}

#paymentSection.show{
    display:block;
    animation:fadeUp .35s ease;
}

.payment-box{
    margin-top:26px;
    padding:21px;
    border-radius:19px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,var(--card),var(--card2));
}

.payment-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    padding-bottom:18px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.payment-badge{
    display:inline-block;
    margin-bottom:8px;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(37,211,102,.1);
    color:#65ed99;
    font-size:.67rem;
    font-weight:900;
}

.payment-title{
    font-size:1.3rem;
}

.payment-subtitle{
    max-width:600px;
    margin-top:6px;
    color:var(--muted);
    font-size:.82rem;
    line-height:1.5;
}

.payment-amount{
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,213,74,.08);
    border:1px solid rgba(255,213,74,.15);
    white-space:nowrap;
}

.payment-amount span{
    display:block;
    color:var(--muted);
    font-size:.68rem;
}

.payment-amount strong{
    color:var(--accent);
    font-size:1.15rem;
}

.payment-content{
    display:grid;
    grid-template-columns:330px 1fr;
    gap:20px;
    padding-top:20px;
}

.qr-card{
    padding:17px;
    border-radius:16px;
    text-align:center;
    background:rgba(0,0,0,.15);
    border:1px solid rgba(255,255,255,.06);
}

.qr-title{
    font-weight:900;
}

.qr-description{
    margin-top:5px;
    color:var(--muted);
    font-size:.75rem;
    line-height:1.4;
}

.qr-wrapper{
    display:flex;
    justify-content:center;
    margin:15px 0;
}

.qr-wrapper img{
    width:225px;
    height:225px;
    max-width:100%;
    object-fit:contain;
    background:#fff;
    padding:7px;
    border-radius:13px;
}

.upi-note{
    color:var(--muted);
    font-size:.74rem;
    line-height:1.4;
}

.payment-info{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.payment-info-card{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:13px;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);
}

.info-number{
    width:27px;
    height:27px;
    flex:0 0 27px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:rgba(255,213,74,.1);
    color:var(--accent);
    font-size:.75rem;
    font-weight:900;
}

.payment-info-card strong{
    font-size:.83rem;
}

.payment-info-card p{
    margin-top:4px;
    color:var(--muted);
    font-size:.75rem;
    line-height:1.4;
}

.payment-notice{
    margin-top:auto;
    padding:12px;
    border-radius:12px;
    background:rgba(255,213,74,.05);
    border:1px solid rgba(255,213,74,.1);
    color:var(--muted);
    font-size:.74rem;
    line-height:1.45;
}

.payment-notice strong{
    color:var(--accent);
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:19px;
    padding:16px;
    border:0;
    border-radius:13px;
    background:var(--green);
    color:#fff;
    font-weight:900;
    font-size:1rem;
    cursor:pointer;
    transition:.2s;
}

.whatsapp-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

.whatsapp-icon{
    font-size:1.2rem;
}

.whatsapp-arrow{
    margin-left:auto;
    font-size:1.15rem;
}

.payment-footer{
    margin-top:9px;
    text-align:center;
    color:var(--muted);
    font-size:.7rem;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .diamond-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
    }

}

@media(max-width:800px){

    .account-grid{
        grid-template-columns:1fr 1fr;
    }

    .validate-btn{
        grid-column:1/-1;
        width:100%;
    }

    .diamond-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .payment-content{
        grid-template-columns:1fr;
    }

    .payment-amount{
        text-align:left;
    }

}

@media(max-width:600px){

    .container{
        width:min(100% - 16px,1180px);
        padding-top:10px;
    }

    .hero{
        min-height:290px;
        border-radius:18px;
    }

    .hero-content{
        min-height:290px;
        padding:25px 20px;
    }

    .hero-logo{
        width:64px;
        height:64px;
    }

    .hero h1{
        font-size:2rem;
    }

    .hero-description{
        font-size:.84rem;
    }

    .account-grid{
        grid-template-columns:1fr;
    }

    .validate-btn{
        grid-column:auto;
    }

    .special-grid{
        grid-template-columns:1fr 1fr;
    }

    .special-card{
        flex-direction:column;
        align-items:stretch;
        padding:8px;
    }

    .special-card img{
        width:100%;
        height:80px;
    }

    .special-info{
        padding:2px;
    }

    .special-name{
        font-size:.78rem;
    }

    .special-price{
        font-size:.82rem;
    }

    .diamond-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px;
    }

    .diamond-card{
        min-height:82px;
    }

    .diamond-amount{
        font-size:.88rem;
    }

    .diamond-price{
        font-size:.78rem;
    }

    .summary-header{
        display:block;
    }

    .summary-status{
        display:inline-block;
        margin-top:10px;
    }

    .payment-header{
        display:block;
    }

    .payment-amount{
        margin-top:13px;
    }

}

@media(max-width:380px){

    .diamond-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}
</style>


<script>

document.addEventListener("DOMContentLoaded",function(){

    /* =========================
       STATE
    ========================= */

    let selectedPackage = "";
    let selectedPrice = "";
    let validated = false;


    /* =========================
       ELEMENTS
    ========================= */

    const playerId =
        document.getElementById("playerId");

    const serverId =
        document.getElementById("serverId");

    const validateBtn =
        document.getElementById("validateBtn");

    const validationStatus =
        document.getElementById("validationStatus");

    const orderArea =
        document.getElementById("orderArea");

    const diamondCards =
        document.querySelectorAll(".diamond-card");

    const specialCards =
        document.querySelectorAll(".special-card");

    const selectedPackageEl =
        document.getElementById("selectedPackage");

    const selectedPriceEl =
        document.getElementById("selectedPrice");

    const summaryPlayerId =
        document.getElementById("summaryPlayerId");

    const summaryServerId =
        document.getElementById("summaryServerId");

    const summaryStatus =
        document.getElementById("summaryStatus");

    const summaryMessage =
        document.getElementById("summaryMessage");

    const continueBtn =
        document.getElementById("continueBtn");

    const paymentSection =
        document.getElementById("paymentSection");

    const paymentAmount =
        document.getElementById("paymentAmount");

    const orderBtn =
        document.getElementById("orderBtn");


    /* =========================
       VALIDATION
    ========================= */

    function showValidation(message,type){

        validationStatus.textContent = message;

        validationStatus.className =
            "validation-status show " + type;

    }


    function validateAccount(){

        const pid =
            playerId.value.trim();

        const sid =
            serverId.value.trim();


        if(!pid){

            showValidation(
                "⚠ Please enter your Player ID.",
                "error"
            );

            playerId.focus();

            return;

        }


        if(!sid){

            showValidation(
                "⚠ Please enter your Server ID.",
                "error"
            );

            serverId.focus();

            return;

        }


        validated = true;


        showValidation(
            "✓ Player ID and Server ID entered successfully. You can now select your package.",
            "success"
        );


        summaryPlayerId.textContent = pid;
        summaryServerId.textContent = sid;


        orderArea.classList.add("show");


        setTimeout(function(){

            orderArea.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        },150);

    }


    validateBtn.addEventListener(
        "click",
        validateAccount
    );


    /* =========================
       ENTER KEY
    ========================= */

    playerId.addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                e.preventDefault();

                serverId.focus();

            }

        }
    );


    serverId.addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                e.preventDefault();

                validateAccount();

            }

        }
    );


    /* =========================
       INPUT CHANGES
    ========================= */

    function accountChanged(){

        validated = false;

        validationStatus.className =
            "validation-status";

    }


    playerId.addEventListener(
        "input",
        accountChanged
    );

    serverId.addEventListener(
        "input",
        accountChanged
    );


    /* =========================
       PACKAGE SELECTION
    ========================= */

    function clearSelection(){

        diamondCards.forEach(function(card){

            card.classList.remove("active");

        });

        specialCards.forEach(function(card){

            card.classList.remove("active");

        });

    }


    function selectPackage(card){

        clearSelection();

        card.classList.add("active");


        selectedPackage =
            card.dataset.package;

        selectedPrice =
            card.dataset.price;


        selectedPackageEl.textContent =
            selectedPackage;

        selectedPriceEl.textContent =
            "₹" + selectedPrice;


        summaryStatus.textContent =
            "Selected";

        summaryStatus.classList.add("selected");


        summaryMessage.textContent =
            "Package selected. Continue to payment when ready.";

        summaryMessage.classList.remove("error");


        paymentAmount.textContent =
            "₹" + selectedPrice;

    }


    diamondCards.forEach(function(card){

        card.addEventListener(
            "click",
            function(){

                selectPackage(card);

            }
        );

    });


    specialCards.forEach(function(card){

        card.addEventListener(
            "click",
            function(){

                selectPackage(card);

            }
        );

    });


    /* =========================
       CONTINUE TO PAYMENT
    ========================= */

    continueBtn.addEventListener(
        "click",
        function(){

            const pid =
                playerId.value.trim();

            const sid =
                serverId.value.trim();


            if(!pid || !sid){

                showValidation(
                    "⚠ Please enter your Player ID and Server ID first.",
                    "error"
                );

                document
                    .querySelector(".account-box")
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                return;

            }


            if(!validated){

                showValidation(
                    "⚠ Please tap Validate before continuing.",
                    "error"
                );

                document
                    .querySelector(".account-box")
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                return;

            }


            if(!selectedPackage){

                summaryMessage.textContent =
                    "⚠ Please select a Diamond package or Special Pass.";

                summaryMessage.classList.add("error");

                return;

            }


            paymentAmount.textContent =
                "₹" + selectedPrice;


            paymentSection.classList.add("show");


            setTimeout(function(){

                paymentSection.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            },100);

        }
    );


    /* =========================
       WHATSAPP
    ========================= */

    orderBtn.addEventListener(
        "click",
        function(){

            const pid =
                playerId.value.trim();

            const sid =
                serverId.value.trim();


            if(!pid || !sid){

                showValidation(
                    "⚠ Please enter your Player ID and Server ID.",
                    "error"
                );

                return;

            }


            if(!validated){

                showValidation(
                    "⚠ Please validate your Player ID and Server ID first.",
                    "error"
                );

                return;

            }


            if(!selectedPackage){

                summaryMessage.textContent =
                    "⚠ Please select a package first.";

                summaryMessage.classList.add("error");

                return;

            }


            const message =
`🎮 PANTHEOS GLOBAL STORE

━━━━━━━━━━━━━━━━━━

🎯 Game: Mobile Legends

👤 Player ID: ${pid}
🌐 Server ID: ${sid}

💎 Package: ${selectedPackage}
💰 Price: ₹${selectedPrice}

━━━━━━━━━━━━━━━━━━

💳 Payment: QR / UPI

Please verify my payment and process my MLBB order.

Thank you!`;


            const whatsappNumber =
                "919310651934";


            const whatsappURL =
                "https://wa.me/" +
                whatsappNumber +
                "?text=" +
                encodeURIComponent(message);


            window.open(
                whatsappURL,
                "_blank"
            );

        }
    );


    /* =========================
       INITIAL STATE
    ========================= */

    summaryPlayerId.textContent = "—";
    summaryServerId.textContent = "—";

    selectedPackageEl.textContent =
        "Not Selected";

    selectedPriceEl.textContent =
        "₹0";

    paymentAmount.textContent =
        "₹0";

});

</script>
